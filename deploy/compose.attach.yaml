# Modalità "attach": solo TailTicket + proxy, collegati a un osTicket 1.18 già esistente.
#   COMPOSE_FILE=compose.attach.yaml (./tailticket init --attach lo imposta)
# Il DB esistente si indica con TAILTICKET_DB_* oppure montando il suo ost-config.php (OST_CONFIG_FILE).
name: tailticket

services:
  tailticket:
    image: ${TAILTICKET_IMAGE:-tailticket:local}
    build:
      context: ../apps/web
    restart: unless-stopped
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      OST_CONFIG_PATH: ${OST_CONFIG_PATH_IN_CONTAINER:-}
      OST_DB_HOST: ${TAILTICKET_DB_HOST:-}
      OST_DB_PORT: ${TAILTICKET_DB_PORT:-}
      OST_DB_NAME: ${TAILTICKET_DB_NAME:-}
      OST_DB_USER: ${TAILTICKET_DB_USER:-}
      OST_DB_PASS: ${TAILTICKET_DB_PASSWORD:-}
      OST_TABLE_PREFIX: ${TAILTICKET_TABLE_PREFIX:-}
      OST_SECRET_SALT: ${TAILTICKET_SECRET_SALT:-}
      OST_DB_TIMEZONE: ${TAILTICKET_DB_TIMEZONE:-}
      APP_SESSION_SECRET: ${TAILTICKET_SESSION_SECRET:?impostare TAILTICKET_SESSION_SECRET (./tailticket init --attach)}
      OST_PHP_URL: ${TAILTICKET_CLASSIC_URL:-}
      OST_SMTP_URL: ${TAILTICKET_SMTP_URL:-}
      # proxy fidati davanti alla app (Caddy di questo file: 1); l'IP del client arriva in X-Real-IP
      TAILTICKET_TRUSTED_PROXY_HOPS: ${TAILTICKET_TRUSTED_PROXY_HOPS:-1}
    volumes:
      - ${OST_CONFIG_FILE:-/dev/null}:/etc/osticket/ost-config.php:ro

  proxy:
    image: caddy:2.10.2
    restart: unless-stopped
    depends_on: [tailticket]
    environment:
      TAILTICKET_SITE: ${TAILTICKET_SITE:-:80}
      TAILTICKET_HTTPS: ${TAILTICKET_HTTPS:-off}
      TAILTICKET_TRUSTED_PROXIES: ${TAILTICKET_TRUSTED_PROXIES:-127.0.0.1/32}
      TAILTICKET_MAX_BODY: ${TAILTICKET_MAX_BODY:-40MB}
    ports:
      - "${TAILTICKET_HTTP_PORT:-80}:80"
      - "${TAILTICKET_HTTPS_PORT:-443}:443"
    volumes:
      - ./proxy/Caddyfile.attach:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config

volumes:
  caddy-data:
  caddy-config:
