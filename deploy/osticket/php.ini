; TailTicket — impostazioni PHP per il pannello classico osTicket
expose_php = Off
memory_limit = 256M
upload_max_filesize = 32M
post_max_size = 34M
max_execution_time = 120
date.timezone = UTC
opcache.enable = 1
opcache.validate_timestamps = 0
apc.enabled = 1
; come il PHP web: osTicket (SavedQueue::clearCounts) usa APCu anche da riga di comando
apc.enable_cli = 1
; mail() di PHP → msmtp (configurato dall'entrypoint da SMTP_URL)
sendmail_path = "/usr/bin/msmtp -t --read-envelope-from"
session.cookie_httponly = 1
