# Next.js accanto a un osTicket PHP esistente. Il DB resta quello di osTicket (nessuna migrazione).
#   docker compose -f deploy/docker-compose.yml up -d --build
services:
  next:
    build:
      context: ..
      args:
        NEXT_BASE_PATH: ${NEXT_BASE_PATH:-}
    restart: unless-stopped
    environment:
      # ost-config.php di osTicket montato in sola lettura: DB, prefisso, SECRET_SALT
      OST_CONFIG_PATH: /etc/osticket/ost-config.php
      # fuso del server MySQL (datetime scritti con NOW() e letti come "ora da parete")
      OST_DB_TIMEZONE: ${OST_DB_TIMEZONE:-Europe/Rome}
      # segreto delle sessioni Next (>= 32 caratteri)
      APP_SESSION_SECRET: ${APP_SESSION_SECRET:?impostare APP_SESSION_SECRET}
      # host del DB visto dal container, se diverso da quello in ost-config.php
      OST_DB_HOST: ${OST_DB_HOST:-}
      # invio email senza account SMTP in osTicket: relay SMTP (o sendmail/msmtp)
      OST_SMTP_URL: ${OST_SMTP_URL:-}
      # URL del pannello PHP per il pulsante "Apri nel pannello classico"
      OST_PHP_URL: ${OST_PHP_URL:-}
    volumes:
      - ${OST_CONFIG_FILE:?percorso di include/ost-config.php}:/etc/osticket/ost-config.php:ro
    ports:
      - "127.0.0.1:3000:3000"

  # Reverse proxy opzionale: /app → Next, tutto il resto → osTicket PHP (vedi deploy/nginx.conf)
  proxy:
    image: nginx:1.27-alpine
    profiles: ["proxy"]
    depends_on: [next]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "80:80"
